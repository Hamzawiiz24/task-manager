<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task &amp; Project Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header>
    <h1>Task &amp; Project Manager</h1>
    <div id="session" hidden><span id="who"></span> <button id="logout" type="button">Log out</button></div>
  </header>
  <p id="toast" role="status" aria-live="polite"></p>

  <main id="main">
    <section id="auth" aria-labelledby="auth-h">
      <h2 id="auth-h">Welcome</h2>
      <div class="split">
        <form id="login-form">
          <h3>Log in</h3>
          <label>Email <input name="email" type="email" required autocomplete="username"></label>
          <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
          <button type="submit">Log in</button>
        </form>
        <form id="register-form">
          <h3>Create account</h3>
          <label>Name <input name="name" required></label>
          <label>Email <input name="email" type="email" required></label>
          <label>Password (6+ characters) <input name="password" type="password" minlength="6" required autocomplete="new-password"></label>
          <label>Role <select name="role"><option value="member">Team member</option><option value="manager">Project manager</option></select></label>
          <button type="submit">Create account</button>
        </form>
      </div>
    </section>

    <div id="app" hidden>
      <nav aria-label="Main">
        <button data-view="tasks" type="button">Tasks</button>
        <button data-view="projects" type="button">Projects</button>
        <button data-view="notifications" type="button">Notifications <span id="badge" hidden></span></button>
        <button data-view="reports" type="button" class="manager-only">Reports</button>
      </nav>

      <section id="view-tasks" aria-labelledby="tasks-h">
        <h2 id="tasks-h">Tasks</h2>
        <form id="task-form" class="manager-only panel">
          <h3>New task</h3>
          <label>Title <input name="title" required></label>
          <label>Description <input name="description"></label>
          <label>Project <select name="projectId" id="task-project" required></select></label>
          <label>Assign to <select name="assigneeId" id="task-assignee"></select></label>
          <label>Priority <select name="priority"><option>Medium</option><option>High</option><option>Low</option></select></label>
          <label>Due date <input name="dueDate" type="date"></label>
          <button type="submit">Create task</button>
        </form>
        <label>Show project <select id="filter-project"></select></label>
        <div id="task-list"></div>
      </section>

      <section id="view-projects" aria-labelledby="projects-h" hidden>
        <h2 id="projects-h">Projects</h2>
        <form id="project-form" class="manager-only panel">
          <h3>New project</h3>
          <label>Title <input name="title" required></label>
          <label>Description <input name="description"></label>
          <button type="submit">Create project</button>
        </form>
        <div id="project-list"></div>
      </section>

      <section id="view-notifications" aria-labelledby="notif-h" hidden>
        <h2 id="notif-h">Notifications</h2>
        <ul id="notif-list"></ul>
      </section>

      <section id="view-reports" aria-labelledby="reports-h" hidden>
        <h2 id="reports-h">Reports</h2>
        <label>Project <select id="report-project"></select></label>
        <div id="report"></div>
      </section>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
