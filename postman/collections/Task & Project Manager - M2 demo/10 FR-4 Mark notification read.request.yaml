$kind: http-request
url: "{{baseUrl}}/api/notifications/{{notifId}}/read"
method: PATCH
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{memberToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 10000
