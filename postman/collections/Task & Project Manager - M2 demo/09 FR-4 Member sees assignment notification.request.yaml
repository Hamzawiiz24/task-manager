$kind: http-request
url: "{{baseUrl}}/api/notifications"
method: GET
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{memberToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('notifId', pm.response.json()[0].id); pm.test('type is assignment', () => pm.expect(pm.response.json()[0].type).to.eql('assignment'));
    language: text/javascript
order: 9000
