$kind: http-request
url: "{{baseUrl}}/api/tasks"
method: GET
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{memberToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('has the task', () => pm.expect(pm.response.json().length).to.be.above(0));
    language: text/javascript
order: 8000
