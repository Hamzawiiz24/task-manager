$kind: http-request
name: 16 FR-1/2/3 Task details (comments + history)
url: "{{baseUrl}}/api/tasks/{{taskId}}"
method: GET
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{memberToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('history logged', () => pm.expect(pm.response.json().history.length).to.eql(2));
    language: text/javascript
order: 16000
