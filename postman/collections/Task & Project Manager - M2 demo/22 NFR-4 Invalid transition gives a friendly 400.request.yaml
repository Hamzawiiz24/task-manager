$kind: http-request
url: "{{baseUrl}}/api/tasks/{{taskId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "To Do"
    }
auth:
  type: bearer
  credentials:
    token: "{{memberToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 22000
