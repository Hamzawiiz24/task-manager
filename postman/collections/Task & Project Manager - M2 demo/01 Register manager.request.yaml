$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Mona",
      "email": "mona{{runId}}@demo.com",
      "password": "secret1",
      "role": "manager"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status is 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 1000
