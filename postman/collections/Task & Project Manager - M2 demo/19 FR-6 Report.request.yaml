$kind: http-request
url: "{{baseUrl}}/api/reports?projectId={{projectId}}"
method: GET
headers:
  Content-Type: application/json
queryParams:
  projectId: "{{projectId}}"
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('completion 100', () => pm.expect(pm.response.json().completionRate).to.eql(100));
    language: text/javascript
order: 19000
