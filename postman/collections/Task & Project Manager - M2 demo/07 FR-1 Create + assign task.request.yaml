$kind: http-request
url: "{{baseUrl}}/api/tasks"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Design homepage",
      "description": "Hero and nav",
      "priority": "High",
      "dueDate": "2030-01-31",
      "projectId": "{{projectId}}",
      "assigneeId": "{{memberId}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('taskId', pm.response.json().id);
    language: text/javascript
order: 7000
