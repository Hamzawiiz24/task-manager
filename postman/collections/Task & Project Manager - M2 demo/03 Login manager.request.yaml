$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "mona{{runId}}@demo.com",
      "password": "secret1"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('managerToken', pm.response.json().token);
    language: text/javascript
order: 3000
