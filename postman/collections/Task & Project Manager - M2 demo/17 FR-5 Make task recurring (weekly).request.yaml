$kind: http-request
url: "{{baseUrl}}/api/tasks/{{taskId}}/recurrence"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "pattern": "weekly"
    }
auth:
  type: bearer
  credentials:
    token: "{{managerToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 17000
