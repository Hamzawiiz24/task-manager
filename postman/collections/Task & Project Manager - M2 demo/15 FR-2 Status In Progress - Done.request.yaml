$kind: http-request
name: 15 FR-2 Status In Progress > Done
url: "{{baseUrl}}/api/tasks/{{taskId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "Done"
    }
auth:
  type: bearer
  credentials:
    token: "{{memberToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 15000
