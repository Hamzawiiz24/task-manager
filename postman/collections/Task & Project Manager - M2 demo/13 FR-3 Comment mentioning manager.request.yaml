$kind: http-request
url: "{{baseUrl}}/api/tasks/{{taskId}}/comments"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "text": "Almost done @mona{{runId}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{memberToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 13000
